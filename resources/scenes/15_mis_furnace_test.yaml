# MIS Furnace Test
#
# A "furnace test" validates energy conservation and MIS correctness.
# In a uniform radiance environment (the "furnace"), a perfectly diffuse
# sphere with albedo=1 must be invisible against the background.
# Spheres with lower albedo should appear as a uniform flat shade.
#
# Any visible rings, bright/dark halos, or non-uniform shading indicates
# a bug in importance sampling or MIS weight computation.
#
# Usage:
#   ./rayon --scene resources/scenes/15_mis_furnace_test.yaml -s 512 -r 1080

camera:
  position: [0.0, 0.0, 8.0]
  look_at:  [0.0, 0.0, 0.0]
  up:       [0.0, 1.0, 0.0]
  fov: 50.0

settings:
  background_color: [1.0, 1.0, 1.0]
  background_intensity: 1.0
  ambient_light: 0.0
  use_bvh: false
  adaptive_sampling: false

# ── Materials ──────────────────────────────────────────────────────────
# Each sphere tests a different albedo / material type.
# In a perfect furnace every sphere should look like a flat disc of colour
# = albedo * background, with no shading variation.

materials:
  # Albedo 1.0 — should be INVISIBLE against the white background
  - name: "white_diffuse"
    type: "lambertian"
    albedo: [1.0, 1.0, 1.0]

  # Albedo 0.5 — should be a uniform mid-grey disc
  - name: "grey_diffuse"
    type: "lambertian"
    albedo: [0.5, 0.5, 0.5]

  # Albedo 0.18 — standard 18 % grey card
  - name: "dark_diffuse"
    type: "lambertian"
    albedo: [0.18, 0.18, 0.18]

  # Rough mirror — tests MIS with specular + glossy lobes
  - name: "rough_mirror_50"
    type: "rough_mirror"
    albedo: [1.0, 1.0, 1.0]
    roughness: 0.5
    metallic: 1.0

  # Low-roughness mirror — nearly specular, stresses MIS balance heuristic
  - name: "rough_mirror_05"
    type: "rough_mirror"
    albedo: [1.0, 1.0, 1.0]
    roughness: 0.05
    metallic: 1.0

  # Glass — total energy should be conserved through refraction
  - name: "glass_sphere"
    type: "glass"
    albedo: [1.0, 1.0, 1.0]
    refractive_index: 1.5
    transmission: 1.0

  # Clear-coat over white diffuse base
  - name: "clearcoat_white"
    type: "clear_coat"
    albedo: [1.0, 1.0, 1.0]
    roughness: 0.05
    refractive_index: 1.5

# ── Geometry ───────────────────────────────────────────────────────────
# Top row:    diffuse spheres (albedo 1.0, 0.5, 0.18)
# Bottom row: specular / glossy / glass / clear-coat (all albedo 1.0)

geometry:
  # ── Top row: diffuse tests ──
  - type: "sphere"
    material: "white_diffuse"
    center: [-2.5, 1.3, 0.0]
    radius: 1.0

  - type: "sphere"
    material: "grey_diffuse"
    center: [0.0, 1.3, 0.0]
    radius: 1.0

  - type: "sphere"
    material: "dark_diffuse"
    center: [2.5, 1.3, 0.0]
    radius: 1.0

  # ── Bottom row: specular / glossy / transmissive tests ──
  - type: "sphere"
    material: "rough_mirror_50"
    center: [-3.75, -1.3, 0.0]
    radius: 1.0

  - type: "sphere"
    material: "rough_mirror_05"
    center: [-1.25, -1.3, 0.0]
    radius: 1.0

  - type: "sphere"
    material: "glass_sphere"
    center: [1.25, -1.3, 0.0]
    radius: 1.0

  - type: "sphere"
    material: "clearcoat_white"
    center: [3.75, -1.3, 0.0]
    radius: 1.0
