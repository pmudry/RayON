# Test scene: OBJ loading and triangle rendering
# Tests Feature G (triangle intersection), H (OBJ loading), and I (YAML+OBJ)

camera:
  position: [-4.552, 1.321, 3.963]
  look_at: [-0.383, 0.393, -1.138]
  fov: 40

settings:
  light_falloff: 2
  light_intensity: 0.6
  background_color: [0.1, 0.1, 0.15]
  background_intensity: 0
  use_bvh: true

materials:
  - name: "ground"
    type: "lambertian"
    albedo: [0.5, 0.5, 0.5]

  - name: "obj_material"
    type: "rough_mirror"
    albedo: [0.9, 0.6, 0.2]
    roughness: 0.15

  - name: "triangle_blue"
    type: "lambertian"
    albedo: [0.2, 0.4, 0.9]

  - name: "area_light"
    type: "light"
    emission: [15, 15, 15]

  - name: glass
    type: glass
    albedo: [1.0, 1.0, 1.0]
    refractive_index: 1.52
    transmission: 1.0

  # Some plastics
  - name: "coat_mirror"
    type: "clear_coat"
    albedo: [0.85, 0.10, 0.08]   # red base (classic pokéball red)
    roughness: 0.00
    refractive_index: 1.5

  - name: "coat_glossy"
    type: "clear_coat"
    albedo: [0.85, 0.10, 0.08]
    roughness: 0.05
    refractive_index: 1.5

  - name: "coat_satin"
    type: "clear_coat"
    albedo: [0.85, 0.10, 0.08]
    roughness: 0.15
    refractive_index: 1.5

  - name: "coat_soft"
    type: "clear_coat"
    albedo: [0.85, 0.10, 0.08]
    roughness: 0.30
    refractive_index: 1.5

  # Some metals
  - name: "brushed"
    type: "anisotropic_metal"
    roughness: 0.3
    anisotropy: 0.7
    preset: "silver"  
  - name: "worn"
    type: "anisotropic_metal"
    roughness: 0.8
    anisotropy: 0.3
    preset: "gold"    
  - name: "machined"
    type: "anisotropic_metal"
    roughness: 0.4
    anisotropy: 0.9
    preset: "copper"
      

geometry:
  # Ground plane
  - type: "rectangle"
    material: "ground"
    corner: [-5000, -1, -5000]
    u: [10000, 0, 0]
    v: [0, 0, 10000]

  # Area light
  - type: "rectangle"
    material: "area_light"
    corner: [-1.5, 4, -1.5]
    u: [3, 0, 0]
    v: [0, 0, 3]

  # OBJ mesh loaded from file
  - type: "obj"
    material: "triangle_blue"
    # material: "coat_glossy"
    # material: "worn"
    # file: "../models/victory.obj"
    # position: [0, -1, 0]
    # scale: [1, 1, 1]
    file: "../models/cupid_yup.obj"   # test: Y-up copy of cupid.obj (raw scan is Z-up), ~430 x 1110 x 790 units
    position: [0.64, -1, -1.18]       # centre X/Z of the bbox brought to the origin, base on the ground
    scale: [0.003, 0.003, 0.003]      # ~3.3 units tall, like victory.obj

  # # Standalone triangle for testing direct triangle geometry
  # - type: "triangle"
  #   material: "triangle_blue"
  #   v0: [-3, -1, -1]
  #   v1: [-1, -1, -1]
  #   v2: [-2, 1, -0.5]
