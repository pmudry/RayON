geometry:
  # Ground plane
  - type: "rectangle"
    material: "ground"
    corner: [-5000, -1, -5000]
    u: [10000, 0, 0]
    v: [0, 0, 10000]

  # Area light
  - type: "rectangle"
    material: "area_light"
    corner: [-1.5, 4, -1.5]
    u: [3, 0, 0]
    v: [0, 0, 3]

  # OBJ mesh loaded from file
  - type: "obj"
    material: "triangle_blue"
    # material: "coat_glossy"
    # material: "worn"
    # file: "../models/victory.obj"
    # position: [0, -1, 0]
    # scale: [1, 1, 1]
    file: "../models/cupid_yup.obj"   # test: Y-up copy of cupid.obj (raw scan is Z-up), ~430 x 1110 x 790 units
    position: [0.64, -1, -1.18]       # centre X/Z of the bbox brought to the origin, base on the ground
    scale: [0.003, 0.003, 0.003]      # ~3.3 units tall, like victory.obj

