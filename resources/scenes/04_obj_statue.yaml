# Test scene: OBJ loading and triangle rendering
# Tests Feature G (triangle intersection), H (OBJ loading), and I (YAML+OBJ)

camera:
  position: [-4.222, 1.569, 4.199]
  look_at: [0.16, 0.313, -0.647]
  fov: 40

settings:
  indirect_clamp: 50
  light_falloff: 2
  light_intensity: 0.6
  background_color: [0.1, 0.1, 0.15]
  background_intensity: 0
  use_bvh: true

materials:
  - name: "ground"
    type: "lambertian"
    albedo: [0.5, 0.5, 0.5]

  - name: "obj_material"
    type: "rough_mirror"
    albedo: [0.9, 0.6, 0.2]
    roughness: 0.15

  - name: "triangle_blue"
    type: "lambertian"
    albedo: [0.2, 0.4, 0.9]

  - name: "area_light"
    type: "light"
    emission: [15, 15, 15]

  - name: glass
    type: glass
    albedo: [1.0, 1.0, 1.0]
    refractive_index: 1.52
    transmission: 1.0

  # Some plastics
  - name: "coat_mirror"
    type: "clear_coat"
    albedo: [0.85, 0.10, 0.08]   # red base (classic pokéball red)
    roughness: 0.00
    refractive_index: 1.5

  - name: "coat_glossy"
    type: "clear_coat"
    albedo: [0.85, 0.10, 0.08]
    roughness: 0.05
    refractive_index: 1.5

