# Bathroom window: sun through rippled glass, caustics on the tiles
#
# A pane of rolled bathroom glass (rippled_glass.obj, a closed slab made by tools/make_ripples.py:
# sine ripples and round dimples on the inner face, analytic normals) fills a window in a tiled
# wall. The sun, a small bright sphere far outside, shines through it: every ripple bends the
# light a little differently and the floor and wall receive the bright, wandering network of a
# swimming pool, drawn by the OptiX caustic pass (light -> glass -> tiles seen by the camera).
# Without the pass (CUDA, --no-caustics) the camera paths find the sun through the pane by
# chance: speckle instead of the network.
#
#   ./rayon -m 4 -s 256 --scene ../resources/scenes/26_bathroom_window.yaml
#   ./rayon -m 4 -s 256 --scene ../resources/scenes/26_bathroom_window.yaml --no-caustics

scene:
  name: "Bathroom window"
  description: "Sun through a pane of rippled bathroom glass: the caustic network on the tiles"

camera:
  position: [1.9, 1.6, 0.9]
  look_at: [-0.3, 0.7, -2.8]
  up: [0.0, 1.0, 0.0]
  fov: 50

settings:
  tone_mapping: "aces"
  exposure: 1
  light_intensity: 1
  light_falloff: 2
  indirect_clamp: 5
  background_color: [0.55, 0.65, 0.80]
  background_intensity: 0.25
  use_bvh: true

materials:
  - name: "tiles"
    type: "lambertian"
    albedo: [0.85, 0.88, 0.89]
    texture: "../textures/tiles_10x10.png"

  - name: "rippled_glass"
    type: "glass"
    refractive_index: 1.5

  - name: "ceiling"
    type: "lambertian"
    albedo: [0.80, 0.80, 0.78]

  - name: "side_wall"
    type: "lambertian"
    albedo: [0.62, 0.64, 0.66]

  - name: "isc_yellow"
    type: "lambertian"
    albedo: [0.969, 0.945, 0.624]

  - name: "isc_blue"
    type: "lambertian"
    albedo: [0.549, 0.776, 0.902]

  - name: "sun"
    type: "light"
    emission: [14000.0, 13400.0, 12100.0]

geometry:
  - type: "obj"
    material: "tiles"
    file: "../models/tiled_floor.obj"
    position: [0, 0, 0]
    scale: [1, 1, 1]
  - type: "obj"
    material: "tiles"
    file: "../models/tiled_wall.obj"
    position: [0, 0, 0]
    scale: [1, 1, 1]
  - type: "obj"
    material: "rippled_glass"
    file: "../models/rippled_glass.obj"
    position: [0, 0, 0]
    scale: [1, 1, 1]

  # Ceiling and side walls
  - type: "rectangle"
    material: "ceiling"
    corner: [-3.0, 3.0, -4.0]
    u: [6.0, 0.0, 0.0]
    v: [0.0, 0.0, 6.0]
  - type: "rectangle"
    material: "side_wall"
    corner: [-3.0, 0.0, -4.0]
    u: [0.0, 0.0, 6.0]
    v: [0.0, 3.0, 0.0]
  - type: "rectangle"
    material: "side_wall"
    corner: [3.0, 0.0, -4.0]
    u: [0.0, 0.0, 6.0]
    v: [0.0, 3.0, 0.0]

  # A ball and a bar of soap on the floor, in the light
  - type: "sphere"
    material: "isc_yellow"
    center: [-0.9, 0.22, -2.4]
    radius: 0.22
  - type: "sphere"
    material: "isc_blue"
    center: [0.4, 0.15, -1.6]
    radius: 0.15

  # The sun: a small bright sphere far outside, up and to the right, hidden from the camera
  - type: "sphere"
    material: "sun"
    center: [3.5, 7.0, -14.0]
    radius: 0.3
    visible: false
