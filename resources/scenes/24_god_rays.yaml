# God rays: a dusty room lit by the sun through a barred window
#
# The room is filled with a thin homogeneous fog: a `volume` material on a box (cube.obj scaled
# to the room, noise_strength 0 and edge 0 for a uniform medium) whose front face stands just in
# front of the camera. Every camera ray enters the fog there and, at each scattering event,
# samples the sun with a shadow ray through the window bars: the lit fog draws the light shafts,
# the shadows of the bars carve them. The sun itself is hidden from the camera.
#
#   ./rayon -m 4 -s 256 --scene ../resources/scenes/24_god_rays.yaml

scene:
  name: "God rays"
  description: "Sun shafts through a barred window in a dusty room (homogeneous volume over the whole room)"

camera:
  position: [-1.6, 1.4, 3.6]
  look_at: [1.6, 1.3, -3.2]
  up: [0.0, 1.0, 0.0]
  fov: 50

settings:
  tone_mapping: "aces"
  exposure: 2.0
  light_intensity: 1
  light_falloff: 2
  indirect_clamp: 30
  background_color: [0.0, 0.0, 0.0]
  background_intensity: 0
  use_bvh: true

materials:
  - name: "haze"
    type: "volume"
    albedo: [0.85, 0.85, 0.85]   # dust: grey-white scattering
    density: 0.15                # extinction per scene unit: the 8 m room stays readable
    g: 0.5                       # forward scattering: the shafts glow towards the camera
    noise_scale: 1.0
    noise_strength: 0.0          # homogeneous
    edge: 0.0                    # hard boundary, no distance grid

  - name: "floor"
    type: "lambertian"
    albedo: [0.42, 0.36, 0.30]
  - name: "wall"
    type: "lambertian"
    albedo: [0.55, 0.53, 0.48]
  - name: "bars"
    type: "lambertian"
    albedo: [0.12, 0.11, 0.10]
  - name: "isc_blue"
    type: "lambertian"
    albedo: [0.549, 0.776, 0.902]
  - name: "isc_yellow"
    type: "lambertian"
    albedo: [0.969, 0.945, 0.624]
  - name: "glass"
    type: "glass"
    refractive_index: 1.5
  - name: "sun"
    type: "light"
    emission: [3600.0, 3280.0, 2760.0]

geometry:
  # The fog box, a hair inside the walls so that no face is coplanar with them:
  # x [-3.98, 3.98], y [0.02, 3.98], z [-3.98, 3.2] (cube.obj has half extent 0.5774)
  - type: "obj"
    material: "haze"
    file: "../models/cube.obj"
    position: [0.0, 2.0, -0.39]
    scale: [6.894, 3.429, 6.218]

  # Room: floor, ceiling, back wall, left wall
  - type: "rectangle"
    material: "floor"
    corner: [-4.0, 0.0, -4.0]
    u: [8.0, 0.0, 0.0]
    v: [0.0, 0.0, 8.0]
  - type: "rectangle"
    material: "wall"
    corner: [-4.0, 4.0, -4.0]
    u: [8.0, 0.0, 0.0]
    v: [0.0, 0.0, 8.0]
  - type: "rectangle"
    material: "wall"
    corner: [-4.0, 0.0, -4.0]
    u: [8.0, 0.0, 0.0]
    v: [0.0, 4.0, 0.0]
  - type: "rectangle"
    material: "wall"
    corner: [-4.0, 0.0, -4.0]
    u: [0.0, 0.0, 8.0]
    v: [0.0, 4.0, 0.0]

  # Right wall (x = 4) around a window opening z [-2.6, -0.6], y [1.2, 3.0]
  - type: "rectangle"
    material: "wall"
    corner: [4.0, 0.0, -4.0]
    u: [0.0, 0.0, 1.4]
    v: [0.0, 4.0, 0.0]
  - type: "rectangle"
    material: "wall"
    corner: [4.0, 0.0, -0.6]
    u: [0.0, 0.0, 4.6]
    v: [0.0, 4.0, 0.0]
  - type: "rectangle"
    material: "wall"
    corner: [4.0, 0.0, -2.6]
    u: [0.0, 0.0, 2.0]
    v: [0.0, 1.2, 0.0]
  - type: "rectangle"
    material: "wall"
    corner: [4.0, 3.0, -2.6]
    u: [0.0, 0.0, 2.0]
    v: [0.0, 1.0, 0.0]
  # Window bars: three vertical, one horizontal (12 cm wide)
  - type: "rectangle"
    material: "bars"
    corner: [4.0, 1.2, -2.16]
    u: [0.0, 0.0, 0.12]
    v: [0.0, 1.8, 0.0]
  - type: "rectangle"
    material: "bars"
    corner: [4.0, 1.2, -1.66]
    u: [0.0, 0.0, 0.12]
    v: [0.0, 1.8, 0.0]
  - type: "rectangle"
    material: "bars"
    corner: [4.0, 1.2, -1.16]
    u: [0.0, 0.0, 0.12]
    v: [0.0, 1.8, 0.0]
  - type: "rectangle"
    material: "bars"
    corner: [4.0, 2.04, -2.6]
    u: [0.0, 0.0, 2.0]
    v: [0.0, 0.12, 0.0]

  # Things in the room catching the shafts
  - type: "sphere"
    material: "isc_blue"
    center: [1.2, 0.55, -1.6]
    radius: 0.55
  - type: "sphere"
    material: "isc_yellow"
    center: [-1.4, 0.4, -0.4]
    radius: 0.4
  - type: "sphere"
    material: "glass"
    center: [2.4, 0.45, -2.6]
    radius: 0.45

  # The sun: a bright sphere outside the window, up and to the right, hidden from the camera
  - type: "sphere"
    material: "sun"
    center: [16.0, 7.5, -1.6]
    radius: 0.3
    visible: false
