# Platonic Solids showcase - one material per solid, studio lighting
# The five Platonic solids: tetrahedron, cube, octahedron, dodecahedron, icosahedron
# Glass, ISC-blue lacquer, brushed gold, soap-film iridescence and polished copper on a dark
# lacquered floor, under a three-lamp studio rig (warm key, cool rim, soft fill). ACES tone mapping
# keeps the faces that mirror a lamp below white, so their edges stay antialiased.

camera:
  position: [0, 3, 9]
  look_at: [0, 0.2, 0]
  fov: 40

settings:
  background_color: [0.10, 0.11, 0.14]
  background_intensity: 0.12
  tone_mapping: "aces"
  exposure: 0.85
  adaptive_sampling: false
  use_bvh: true

materials:
  # Dark lacquer: the solids and the lamps mirror softly in it
  - name: "floor"
    type: "clear_coat"
    albedo: [0.05, 0.05, 0.06]
    roughness: 0.06
    refractive_index: 1.5

  - name: "wall"
    type: "lambertian"
    albedo: [0.12, 0.12, 0.14]

  - name: "glass"
    type: "glass"
    refractive_index: 1.5

  # ISC "Informatique logicielle" blue, as car paint
  - name: "isc_blue_lacquer"
    type: "clear_coat"
    albedo: [0.549, 0.776, 0.902]
    roughness: 0.02
    refractive_index: 1.5

  - name: "brushed_gold"
    type: "anisotropic_metal"
    preset: "gold"
    roughness: 0.25
    anisotropy: 0.8

  - name: "soap_film"
    type: "thin_film"
    film_thickness: 480.0
    film_ior: 1.33
    refractive_index: 1.0

  - name: "polished_copper"
    type: "anisotropic_metal"
    preset: "copper"
    roughness: 0.12
    anisotropy: 0.0

  # Studio rig
  - name: "key_light"
    type: "light"
    color: [1.0, 0.86, 0.7]
    emission_intensity: 9

  - name: "top_light"
    type: "light"
    color: [1.0, 0.97, 0.92]
    emission_intensity: 5

  - name: "rim_light"
    type: "light"
    color: [0.65, 0.8, 1.0]
    emission_intensity: 14

  - name: "fill_light"
    type: "light"
    color: [0.9, 0.93, 1.0]
    emission_intensity: 2.5

geometry:
  - type: "rectangle"
    material: "floor"
    corner: [-200000000, -0.5, -200000000]
    u: [400000000, 0, 0]
    v: [0, 0, 400000000]

  # Back wall
  - type: "rectangle"
    material: "wall"
    corner: [-200000000, -0.5, -18]
    u: [400000000, 0, 0]
    v: [0, 200000000, 0]

  # Key: warm softbox, front left, above, facing the solids
  - type: "rectangle"
    material: "key_light"
    corner: [-5.036, 4.039, 6.943]
    u: [-2.354, 0.000, -2.590]
    v: [1.425, 2.922, -1.296]

  # Top: overhead softbox, mirrored by the upper faces of the metals and the glass
  - type: "rectangle"
    material: "top_light"
    corner: [-4.5, 5.5, -1.5]
    u: [9.0, 0.0, 0.0]
    v: [0.0, 0.0, 3.0]

  # Rim: cool strip behind and above the row (out of frame), outlines the edges
  - type: "rectangle"
    material: "rim_light"
    corner: [-5.5, 7.718, -3.695]
    u: [11.0, 0.0, 0.0]
    v: [0.0, 0.564, 1.390]

  # Fill: large dim panel, front right, opens the shadows
  - type: "rectangle"
    material: "fill_light"
    corner: [8.165, 0.545, 4.815]
    u: [-2.713, 0.000, 2.939]
    v: [-0.617, 3.911, -0.570]

# === The five Platonic solids, left to right ===

  # 1. Tetrahedron (4 faces) - glass
  - type: "obj"
    material: "glass"
    file: "../models/tetrahedron.obj"
    position: [-4, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 2. Cube (6 faces) - ISC blue lacquer
  - type: "obj"
    material: "isc_blue_lacquer"
    file: "../models/cube.obj"
    position: [-2, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 3. Octahedron (8 faces) - brushed gold
  - type: "obj"
    material: "brushed_gold"
    file: "../models/octahedron.obj"
    position: [0, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 4. Dodecahedron (12 faces) - soap film
  - type: "obj"
    material: "soap_film"
    file: "../models/dodecahedron.obj"
    position: [2, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 5. Icosahedron (20 faces) - polished copper
  - type: "obj"
    material: "polished_copper"
    file: "../models/icosahedron.obj"
    position: [4, 0.8, 0]
    scale: [0.8, 0.8, 0.8]
