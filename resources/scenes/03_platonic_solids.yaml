# Platonic Solids showcase - one material per solid, studio lighting
# The five Platonic solids: tetrahedron, cube, octahedron, dodecahedron, icosahedron
# Glass, ISC-blue lacquer, brushed gold, ISC-green glow glass and hammered copper on a dark
# lacquered floor, under a three-lamp studio rig (warm key, cool rim, soft fill). ACES tone mapping
# keeps the faces that mirror a lamp below white, so their edges stay antialiased.
# ISC colours are given in sRGB (e.g. RGB(140, 198, 230)); as albedos they are squared (display
# gamma 2), or they would come out washed out.

camera:
  position: [0, 3, 9]
  look_at: [0, 0.2, 0]
  fov: 40

settings:
  background_color: [0.10, 0.11, 0.14]
  background_intensity: 0.12
  tone_mapping: "aces"
  exposure: 0.85
  adaptive_sampling: false
  use_bvh: true

materials:
  # Dark lacquer: the solids and the lamps mirror softly in it
  - name: "floor"
    type: "clear_coat"
    albedo: [0.05, 0.05, 0.06]
    roughness: 0.06
    refractive_index: 1.5

  - name: "wall"
    type: "lambertian"
    albedo: [0.12, 0.12, 0.14]

  - name: "glass"
    type: "glass"
    refractive_index: 1.5

  # ISC "Informatique logicielle" blue RGB(140, 198, 230), as car paint
  - name: "isc_blue_lacquer"
    type: "clear_coat"
    albedo: [0.301, 0.602, 0.814]
    roughness: 0.02
    refractive_index: 1.5

  - name: "brushed_gold"
    type: "anisotropic_metal"
    preset: "gold"
    roughness: 0.25
    anisotropy: 0.8

  # Chameleon paint: ISC "Reseaux et systemes" violet RGB(168, 144, 192) seen face-on, turning to
  # ISC "Ingenierie des donnees" yellow RGB(247, 241, 159) as the faces turn away, under a coat
  - name: "isc_chameleon"
    type: "chameleon"
    albedo: [0.434, 0.319, 0.567]
    flip_color: [0.939, 0.893, 0.389]
    roughness: 0.04
    refractive_index: 1.5

  # Glow glass: clear glass filled with a softly glowing ISC-green medium (RGB(152, 199, 191),
  # squared): thick parts glow more than the edges, and it lights the floor a little
  - name: "isc_glow_glass"
    type: "glow_glass"
    refractive_index: 1.5
    emission: [0.36, 0.61, 0.56]
    density: 0.8

  # Hammered copper: a rough copper whose hammer marks tilt the reflections face by face
  - name: "hammered_copper"
    type: "hammered"
    albedo: [0.955, 0.638, 0.538]
    roughness: 0.19
    dimple_size: 0.031
    dimple_depth: 0.17

  # Studio rig
  - name: "key_light"
    type: "light"
    color: [1.0, 0.86, 0.7]
    emission_intensity: 9

  - name: "top_light"
    type: "light"
    color: [1.0, 0.97, 0.92]
    emission_intensity: 5

  - name: "rim_light"
    type: "light"
    color: [0.65, 0.8, 1.0]
    emission_intensity: 14

  - name: "fill_light"
    type: "light"
    color: [0.9, 0.93, 1.0]
    emission_intensity: 2.5

geometry:
  - type: "rectangle"
    material: "floor"
    corner: [-200000000, -0.5, -200000000]
    u: [400000000, 0, 0]
    v: [0, 0, 400000000]

  # Back wall
  - type: "rectangle"
    material: "wall"
    corner: [-200000000, -0.5, -18]
    u: [400000000, 0, 0]
    v: [0, 200000000, 0]

  # Key: warm softbox, front left, above, facing the solids
  - type: "rectangle"
    material: "key_light"
    corner: [-5.036, 4.039, 6.943]
    u: [-2.354, 0.000, -2.590]
    v: [1.425, 2.922, -1.296]

  # Top: overhead softbox, mirrored by the upper faces of the metals and the glass
  - type: "rectangle"
    material: "top_light"
    corner: [-4.5, 5.5, -1.5]
    u: [9.0, 0.0, 0.0]
    v: [0.0, 0.0, 3.0]

  # Rim: cool strip behind and above the row (out of frame), outlines the edges
  - type: "rectangle"
    material: "rim_light"
    corner: [-5.5, 7.718, -3.695]
    u: [11.0, 0.0, 0.0]
    v: [0.0, 0.564, 1.390]

  # Fill: large dim panel, front right, opens the shadows
  - type: "rectangle"
    material: "fill_light"
    corner: [8.165, 0.545, 4.815]
    u: [-2.713, 0.000, 2.939]
    v: [-0.617, 3.911, -0.570]

# === The five Platonic solids, left to right ===

  # 1. Tetrahedron (4 faces) - glass
  - type: "obj"
    material: "glass"
    file: "../models/tetrahedron.obj"
    position: [-4, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 2. Cube (6 faces) - ISC blue lacquer
  - type: "obj"
    material: "isc_blue_lacquer"
    file: "../models/cube.obj"
    position: [-2, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 3. Octahedron (8 faces) - brushed gold
  - type: "obj"
    material: "brushed_gold"
    file: "../models/octahedron.obj"
    position: [0, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 4. Dodecahedron (12 faces) - ISC glow glass
  - type: "obj"
    material: "isc_glow_glass"
    file: "../models/dodecahedron.obj"
    position: [2, 0.8, 0]
    scale: [0.8, 0.8, 0.8]

  # 5. Icosahedron (20 faces) - hammered copper
  - type: "obj"
    material: "hammered_copper"
    file: "../models/icosahedron.obj"
    position: [4, 0.8, 0]
    scale: [0.8, 0.8, 0.8]
