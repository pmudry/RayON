# Anisotropic Aluminum 4×4 Grid
# 16 spheres: X = anisotropy (0.0, 0.33, 0.66, 0.95), Y = roughness (0.1, 0.3, 0.5, 0.8)
# Roughness increases front to back, anisotropy increases left to right.

camera:
  position: [0, 5.85, 8.42]
  look_at: [0, 00, -1.5]
  fov: 42

settings:
  use_bvh: true
  background_color: [0.04, 0.04, 0.8]
  background_intensity: 0.05
  adaptive_sampling: false

materials:
  - name: ground
    type: lambertian
    albedo: [1.0, 0.85, 0.57]   # tint = gold
    roughness: 0.03              # near-perfect reflection

  - name: "area_light"
    type: "light"
    emission: [4.8, 4.1, 3.7]
    albedo: [1.0, 1.0, 1.0]

# Geometry definitions
geometry:
  - type: "sphere"
    material: "ground"
    center: [0.0, -950.5, -1.0]
    radius: 950.0

  # Area light (rectangular emitter)
  - type: "rectangle"
    material: "area_light"
    corner: [-1.0, 5.0, -2.0]
    u: [2.5, 0.0, 0.0]
    v: [0.0, 0.0, 1.5]